# Build de l'APK release à la création d'un tag de version, puis publication
# dans une GitHub Release, sous le nom constant nextcloud-dream.apk.
#
# Tags acceptés : V1.02.03, V1.002.003 (ou avec un v minuscule)
#   git tag V1.00.00 && git push origin V1.00.00
#
# Signature : si les secrets SIGNING_* sont définis, l'APK est signé avec cette clé
# (indispensable pour mettre à jour l'app sans la désinstaller). Sinon, avec une clé
# debug générée par le runner, différente à chaque build.
name: Release APK

on:
  push:
    tags:
      - "v[0-9]*"
      - "V[0-9]*"

permissions:
  contents: write # création de la GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Vérification du format du tag
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -Eq '^[vV][0-9]{1,2}\.[0-9]{1,3}\.[0-9]{1,3}$'; then
            echo "::error::Tag « $GITHUB_REF_NAME » invalide : attendu Vxx.xxx.xxx"
            exit 1
          fi

      - name: Installation du JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installation de Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Préparation de la clé de signature
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret SIGNING_KEYSTORE_BASE64 absent : APK signé avec une clé debug temporaire"
          fi

      - name: Build de l'APK release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PappVersion="$GITHUB_REF_NAME"

      # Nom volontairement sans version : c'est ce qui rend l'URL de
      # téléchargement constante (releases/latest/download/nextcloud-dream.apk).
      - name: Renommage de l'APK
        run: cp app/build/outputs/apk/release/app-release.apk nextcloud-dream.apk

      - name: Publication de la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nextcloud-dream.apk
          generate_release_notes: true
