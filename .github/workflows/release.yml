# Build de l'APK release à la création d'un tag de version, puis publication
# dans une GitHub Release, sous le nom constant nextcloud-dream.apk.
#
# Tags acceptés : V1.02.03, V1.002.003 (ou avec un v minuscule)
#   git tag V1.00.00 && git push origin V1.00.00
#
# Signature : les quatre secrets SIGNING_* sont obligatoires, le build échoue sans eux.
# Une release signée par la clé debug du runner serait ingérable : cette clé change à
# chaque build, donc Android refuserait la mise à jour d'une version à l'autre.
name: Release APK

on:
  push:
    tags:
      - "v[0-9]*"
      - "V[0-9]*"

permissions:
  contents: write # création de la GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Vérification du format du tag
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -Eq '^[vV][0-9]{1,2}\.[0-9]{1,3}\.[0-9]{1,3}$'; then
            echo "::error::Tag « $GITHUB_REF_NAME » invalide : attendu Vxx.xxx.xxx"
            exit 1
          fi

      - name: Installation du JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installation de Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v4

      # jacocoTestReport dépend de testDebugUnitTest : les tests restent bloquants.
      - name: Tests unitaires et couverture
        run: |
          chmod +x gradlew
          ./gradlew jacocoTestReport

      - name: Badge de couverture
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.csv
          badges-directory: .github/badges
          generate-coverage-badge: true
          generate-branches-badge: true

      # Les secrets sont dans Settings > Secrets and variables > Actions, onglet
      # « Secrets » : une « Repository variable » du même nom ne serait pas lue ici.
      - name: Préparation de la clé de signature
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          manquants=""
          for secret in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then manquants="$manquants $secret"; fi
          done
          if [ -n "$manquants" ]; then
            echo "::error::Secrets de signature absents :$manquants — à définir dans Settings > Secrets and variables > Actions, onglet Secrets (et non Variables)."
            exit 1
          fi

          keystore="$RUNNER_TEMP/release.keystore"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          # Vérifié tout de suite : un base64 tronqué ou un mauvais alias échouerait
          # sinon au milieu du build, avec un message de Gradle peu parlant.
          if ! keytool -list -keystore "$keystore" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" > /dev/null 2>&1; then
            # Pas de valeur dans le message : les logs d'un dépôt public sont lisibles par tous.
            echo "::error::Keystore inutilisable : base64 tronqué, mot de passe erroné, ou alias absent du magasin."
            exit 1
          fi
          echo "SIGNING_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build de l'APK release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PappVersion="$GITHUB_REF_NAME"

      # Nom volontairement sans version : c'est ce qui rend l'URL de
      # téléchargement constante (releases/latest/download/nextcloud-dream.apk).
      - name: Renommage de l'APK
        run: cp app/build/outputs/apk/release/app-release.apk nextcloud-dream.apk

      - name: Publication de la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nextcloud-dream.apk
          generate_release_notes: true

      # En dernier : cette étape bascule l'arbre de travail du tag vers main, le build
      # ne doit plus rien lire ensuite. Le tag n'étant pas une branche, on ne peut pas
      # committer dessus ; le badge va donc sur main, d'où le tag est issu. Pas de
      # boucle possible, ce workflow ne se déclenche que sur un tag.
      - name: Publication du badge sur main
        run: |
          mkdir -p "$RUNNER_TEMP/badges"
          cp .github/badges/*.svg "$RUNNER_TEMP/badges/"
          rm -rf .github/badges

          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD
          mkdir -p .github/badges
          cp "$RUNNER_TEMP/badges"/*.svg .github/badges/

          if git diff --quiet -- .github/badges; then
            echo "Couverture inchangée : badge déjà à jour sur main."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges
          git commit -m "Update the coverage badge for $GITHUB_REF_NAME"
          git push origin main
